<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dev Kumar Mahur's Journey</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: 'Orbitron', sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* Background video */
.video-container {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Foreground content */
.content {
  position: relative;
  z-index: 1;
  padding: 20px;
}

/* Title */
h1 {
  font-size: 2rem;
  color: black;
  margin-bottom: 5px;
}

/* Link */
a {
  color: red;
  font-size: 1.2rem;
  text-decoration: none;
}

a:hover {
  color: #ff0000;
  text-shadow: 0 0 6px red, 0 0 12px red;
}

/* Music button */
.music-btn {
  position: fixed;
  top: 15px;
  right: 15px;
  background: rgba(0,0,0,0.7);
  border: 2px solid red;
  color: red;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  z-index: 2;
  transition: 0.3s;
}

.music-btn.active {
  background: red;
  color: black;
  text-shadow: 0 0 10px red;
}

/* Mobile */
@media (max-width: 600px) {
  h1 { font-size: 1.5rem; }
  a { font-size: 1rem; }
}
</style>
</head>

<body>

<div class="video-container">
  <video autoplay muted loop playsinline>
    <source src="samurai.mp4" type="video/mp4">
  </video>
</div>

<audio id="bg-music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="music-btn" id="music-btn">🔇</div>

<div class="content">
  <h1>School Practicals</h1>
  <a href="https://no-body-0.github.io/CS/">View</a>
</div>

<script>
const audio = document.getElementById("bg-music");
const btn = document.getElementById("music-btn");
let playing = false;

btn.addEventListener("click", e => {
  e.stopPropagation();

  if (playing) {
    audio.pause();
    btn.textContent = "🔇";
    btn.classList.remove("active");
  } else {
    audio.play().then(() => {
      btn.textContent = "🔊";
      btn.classList.add("active");
      playing = true;
    }).catch(err => console.log(err));
    return;
  }
  playing = false;
});
</script>

</body>
</html>
